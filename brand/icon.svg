<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Omichat app icon: two overlapping speech bubbles forming a rounded "O".
       Cream ring bubble + yellow small bubble on black. Palette: #FFFEEA #FFEE6F #000000.
       Render once to PNG: see brand/ICON.md for the command. -->
  <rect width="1024" height="1024" fill="#000000"/>
  <!-- ring bubble (the "O") -->
  <circle cx="460" cy="560" r="250" fill="none" stroke="#FFFEEA" stroke-width="96"/>
  <polygon points="250,660 360,790 196,884" fill="#FFFEEA"/>
  <!-- separation halo: cuts a black gap where the bubbles overlap -->
  <circle cx="700" cy="370" r="170" fill="#000000" stroke="#000000" stroke-width="80"/>
  <!-- small bubble -->
  <polygon points="790,470 880,620 700,540" fill="#FFEE6F" stroke="#000000" stroke-width="40" stroke-linejoin="round"/>
  <circle cx="700" cy="370" r="170" fill="#FFEE6F"/>
</svg>
